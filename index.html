<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b6f8a">
  <meta name="description" content="Hold the causeway against the red tide. Fifty levels. No ads, no energy, nothing to buy.">
  <title>Breakwater</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Breakwater">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <button id="btn-pause" class="plate icon-btn" aria-label="Pause"><span class="pause-glyph"></span></button>
      <div class="plate parts" aria-live="off">
        <span class="parts-bolt" aria-hidden="true"></span>
        <span id="parts">0</span>
      </div>
      <button id="btn-speed" class="plate icon-btn" aria-label="Game speed">1x</button>
    </div>
    <div class="hud-status">
      <div id="level-tag" class="level-tag" role="img">
        <span class="level-tag-name"><b id="level-num"></b> <span id="level-name"></span></span>
        <span class="level-tag-best">Best <span id="level-bolts" class="bolts"></span></span>
      </div>
      <div class="gauge" role="img" id="gauge" aria-label="Pump house health">
        <div class="gauge-fill" id="gauge-fill"></div>
        <span class="gauge-text">Pump house <b id="hp">15</b></span>
      </div>
      <div class="wave-row">
        <span id="wave-text"></span>
        <button id="btn-send" class="send">Send now</button>
      </div>
      <div id="effects" class="effects"></div>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="coach" class="coach" hidden></div>
    <div id="pad-stats" class="pad-stats" hidden></div>
    <div id="pad-panel" class="pad-panel" hidden></div>
  </div>

  <section id="screen-title" class="screen title-screen" hidden>
    <h1 class="title">Breakwater</h1>
    <p class="tagline">Hold the causeway against the red tide.</p>
    <p class="promise">Fifty levels. No ads, no energy, nothing to buy.</p>
    <button id="btn-play" class="btn primary big">Play</button>
    <button id="btn-install" class="btn quiet" hidden>Install game</button>
  </section>

  <section id="screen-levels" class="screen panel-screen" hidden>
    <div class="panel-head">
      <button id="btn-levels-back" class="btn quiet">Back</button>
      <h2>Pick a level</h2>
      <span id="bolt-total" class="bolt-total"></span>
    </div>
    <div id="level-list" class="level-list"></div>
  </section>

  <section id="screen-pause" class="screen dialog-screen" hidden>
    <div class="dialog plate">
      <h2>Paused</h2>
      <button id="btn-resume" class="btn primary">Resume</button>
      <button id="btn-restart" class="btn">Restart level</button>
      <button id="btn-sound" class="btn">Sound on</button>
      <button id="btn-quit" class="btn">All levels</button>
    </div>
  </section>

  <section id="screen-result" class="screen dialog-screen" hidden>
    <div class="dialog plate">
      <h2 id="result-title"></h2>
      <div id="result-bolts" class="bolts large"></div>
      <p id="result-text"></p>
      <div id="result-damage" class="damage-report" hidden></div>
      <button id="btn-next" class="btn primary">Next level</button>
      <button id="btn-retry" class="btn">Try again</button>
      <button id="btn-result-levels" class="btn">All levels</button>
    </div>
  </section>

  <div id="fatal" class="fatal" hidden>
    <p id="fatal-text"></p>
    <button id="btn-fatal-reload" class="btn primary">Reload game</button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
